{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ section.title }}
</h1>

<ul>
  {% for sub in section.subsections %}
    {% set s = get_section(path=sub) %}
    <li>
      <a href="{{ s.permalink | trim_start(pat=config.base_url) }}">{{ s.title }}</a>
    </li>
  {% endfor %}
</ul>
{% endblock content %}
