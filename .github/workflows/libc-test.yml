# SPDX-License-Identifier: CC0-1.0
name: Run libc-test
on:
  pull_request:
    paths:
      - .github/workflows/libc-test.yml
      - 'libc-test/**'
  workflow_dispatch:
  workflow_call:

env:
  ALPINE_BRANCH: v3.24

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          case "${{ matrix.platform.arch }}" in
            x86_64) qemu_arch=x86;;
            aarch64) qemu_arch=arm;;
          esac
          sudo apt-get update
          sudo apt-get install qemu-utils qemu-system-"$qemu_arch" expect

      - name: Prepare to create VM image
        run: |
          sed \
            -e "s/@ALPINE_BRANCH@/$ALPINE_BRANCH/" \
            -e 's|@R2_DEV_URL@|${{ secrets.r2_dev_url }}|' \
            apk/repositories.in > apk/repositories

      - uses: ./.github/actions/alpine-make-vm-image
        id: make-vm-image
        with:
          boot-mode: UEFI
          image-format: qcow2
          keys-dir: apk/keys/"${{ matrix.platform.arch }}"
          repositories-file: apk/repositories
          packages: 'edk2-shell su-exec libc-test'
          script-chroot: 'true'
          serial-console: 'true'
          image: alpine-vm.qcow2
          script: ./configure.sh

      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - name: Enable KVM group perms
        if: ${{ runner.arch == 'X64' }}
        run: |
          echo ::group::Enable KVM group perms
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo ::endgroup::

      - name: Run test on QEMU
        run: |
          echo ::group::Configure per architecture
          set -x
          case "${{ matrix.platform.arch }}" in
            x86_64)
              kvm=
              cpu=host
              uefi_code=/usr/share/OVMF/OVMF_CODE_4M.fd
              uefi_vars=/usr/share/OVMF/OVMF_VARS_4M.fd
              ;;
            aarch64)
              machine=virt
              cpu=cortex-a76
              uefi_code=/usr/share/AAVMF/AAVMF_CODE.fd
              uefi_vars=/usr/share/AAVMF/AAVMF_VARS.fd
              ;;
          esac
          set +x
          echo ::endgroup::

          echo ::group::Run libc-test
          ./libc-test/run.exp sudo qemu-system-"${{ matrix.platform.arch }}" \
            -m 3G \
            ${machine:+--machine "$machine"} \
            ${kvm+-enable-kvm} \
            -cpu "$cpu" \
            -smp "$(nproc)" \
            ${uefi_code:+-drive if=pflash,format=raw,readonly=on,file="$uefi_code"} \
            ${uefi_vars:+-drive if=pflash,format=raw,file="$uefi_vars"} \
            -drive if=none,file="${{ steps.make-vm-image.outputs.image }}",format=qcow2,id=hd0 \
            -device virtio-blk-pci,drive=hd0 \
            -device virtio-rng-pci \
            -display none \
            -chardev stdio,id=tty \
            -device virtio-serial \
            -device virtconsole,chardev=tty \
            | tee libc-test.log
          echo
          grep '^FAIL ' libc-test.log | sed 's/^FAIL /::warning::FAIL /'
          echo
          echo ::endgroup::

          echo ::group::Extract test log from VM image
          sudo modprobe nbd
          sudo qemu-nbd -c /dev/nbd0 "${{ steps.make-vm-image.outputs.image }}"
          mkdir root
          sudo mount /dev/nbd0p2 root
          cp root/opt/libc-test/src/REPORT libc-test-${{ matrix.platform.arch }}.log
          sudo umount root
          sudo qemu-nbd -d /dev/nbd0
          echo ::endgroup::

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: libc-test-${{ matrix.platform.arch }}.log
          archive: false
