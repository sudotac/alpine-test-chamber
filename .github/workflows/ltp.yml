# SPDX-License-Identifier: CC0-1.0
name: Run ltp
on:
  pull_request:
    paths:
      - .github/workflows/ltp.yml
  workflow_dispatch:
  workflow_call:

env:
  ALPINE_BRANCH: v3.24

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
        suite: [syscalls]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          case "${{ matrix.platform.arch }}" in
            x86_64) qemu_arch=x86;;
            aarch64) qemu_arch=arm;;
          esac
          sudo apt-get update
          sudo apt-get install qemu-utils qemu-system-"$qemu_arch" python3-pip
          sudo pip install kirk

      - name: Prepare to create VM image
        run: |
          sed \
            -e "s/@ALPINE_BRANCH@/$ALPINE_BRANCH/" \
            -e 's|@R2_DEV_URL@|${{ secrets.r2_dev_url }}|' \
            apk/repositories.in > apk/repositories

      - uses: ./.github/actions/alpine-make-vm-image
        id: make-vm-image
        with:
          image-format: qcow2
          image-size: 8G
          keys-dir: apk/keys/"${{ matrix.platform.arch }}"
          repositories-file: apk/repositories
          packages: 'edk2-shell ltp'
          script-chroot: 'true'
          serial-console: 'true'
          image: alpine-vm.qcow2
          script: ./configure.sh

      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - name: Enable KVM group perms
        if: ${{ runner.arch == 'X64' }}
        run: |
          echo ::group::Enable KVM group perms
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo ::endgroup::

      - name: Run test on QEMU
        run: |
          echo ::group::Configure per architecture
          set -x
          if [ "${{ matrix.platform.arch }}" = aarch64 ]; then
            machine=virt
            cpu=cortex-a76
            uefi_code=/usr/share/AAVMF/AAVMF_CODE.fd
            uefi_vars=/usr/share/AAVMF/AAVMF_VARS.fd
            options="-machine $machine -cpu $cpu -drive if=pflash,format=raw,readonly=on,file=$uefi_code -drive if=pflash,format=raw,file=$uefi_vars"

            sudo sed -i \
              -e '/"-enable-kvm"/d' \
              -e 's|/dev/vport1p1|/dev/vport2p1|' \
              "$(python -c 'import libkirk; print(libkirk.__path__[0])')"/channels/qemu.py
          fi
          set +x
          echo ::endgroup::

          echo ::group::Run ltp
          sudo LTP_TIMEOUT_MUL=8 kirk \
            --com "qemu:image=${{ steps.make-vm-image.outputs.image }}:user=root:system=${{ matrix.platform.arch }}:ram=3G:smp=$(nproc):serial=virtio${options:+:options=$options}" \
            --sut default:com=qemu \
            --suite-timeout 2h \
            --run-suite ${{ matrix.suite }} \
            --json-report ltp-${{ matrix.platform.arch }}-${{ matrix.suite }}.json
          echo ::endgroup::

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ltp-${{ matrix.platform.arch }}-${{ matrix.suite }}.json
          archive: false
