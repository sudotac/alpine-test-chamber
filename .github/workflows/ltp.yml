# SPDX-License-Identifier: CC0-1.0
name: Run ltp
on:
  pull_request:
    paths:
      - .github/workflows/ltp.yml
  workflow_dispatch:
  workflow_call:

env:
  ALPINE_BRANCH: v3.24

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
        suite: [syscalls]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prefer original sudo to sudo-rs
        run: |
          sudo update-alternatives --set sudo /usr/bin/sudo.ws

      - name: Create VM image
        run: |
          echo ::group::Download alpine-make-vm-image script
          wget https://raw.githubusercontent.com/alpinelinux/alpine-make-vm-image/v0.13.4/alpine-make-vm-image \
            && echo '03dc4581b1eaa34a951cc210e963b98ded44dc469f7d0c05f00431ceb58390b78f3db0386fc94aa1e5b2c6471f2dd74b663454179781bdd3a30776ffa525e2cb  alpine-make-vm-image' | sha512sum -c \
            || exit 1
          echo ::endgroup::

          echo ::group::Install dependencies
          set -x
          case "${{ matrix.platform.arch }}" in
            x86_64) qemu_arch=x86;;
            aarch64) qemu_arch=arm;;
          esac
          set +x
          sudo apt-get update
          sudo apt-get install qemu-utils qemu-system-"$qemu_arch" python3-pip
          sudo pip install kirk
          echo ::endgroup::

          echo ::group::Create Alpine VM image
          sed \
            -e "s/@ALPINE_BRANCH@/$ALPINE_BRANCH/" \
            -e 's|@R2_DEV_URL@|${{ secrets.r2_dev_url }}|' \
            apk/repositories.in > apk/repositories
          sed -i \
            -e "s/'ttyS0'/'hvc0'/" \
            -e "s/'console=tty0'/'console=hvc0'/" \
            alpine-make-vm-image
          sudo sh ./alpine-make-vm-image \
            --image-format qcow2 \
            --image-size 8G \
            --keys-dir apk/keys/"${{ matrix.platform.arch }}" \
            --repositories-file apk/repositories \
            --packages 'edk2-shell ltp' \
            --script-chroot \
            --serial-console \
            alpine-vm.qcow2 -- ./configure.sh
          echo ::endgroup::

      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - name: Enable KVM group perms
        if: ${{ runner.arch == 'X64' }}
        run: |
          echo ::group::Enable KVM group perms
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo ::endgroup::

      - name: Run test on QEMU
        run: |
          echo ::group::Configure per architecture
          set -x
          if [ "${{ matrix.platform.arch }}" = aarch64 ]; then
            machine=virt
            cpu=cortex-a76
            uefi_code=/usr/share/AAVMF/AAVMF_CODE.fd
            uefi_vars=/usr/share/AAVMF/AAVMF_VARS.fd
            options="-machine $machine -cpu $cpu -drive if=pflash,format=raw,readonly=on,file=$uefi_code -drive if=pflash,format=raw,file=$uefi_vars"

            sudo sed -i \
              -e '/"-enable-kvm"/d' \
              -e 's|/dev/vport1p1|/dev/vport2p1|' \
              "$(python -c 'import libkirk; print(libkirk.__path__[0])')"/channels/qemu.py
          fi
          set +x
          echo ::endgroup::

          echo ::group::Run ltp
          sudo LTP_TIMEOUT_MUL=8 kirk \
            --com "qemu:image=alpine-vm.qcow2:user=root:system=${{ matrix.platform.arch }}:ram=3G:smp=$(nproc):serial=virtio${options:+:options=$options}" \
            --sut default:com=qemu \
            --suite-timeout 2h \
            --run-suite ${{ matrix.suite }} \
            --json-report ${{ matrix.platform.arch }}-${{ matrix.suite }}.json
          echo ::endgroup::

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ltp
          path: ${{ matrix.platform.arch }}-${{ matrix.suite }}.json
          archive: false
