# SPDX-License-Identifier: CC0-1.0
name: Run tests and deploy results on GitHub Pages
on:
  schedule:
    - cron: '30 18 * * 4'
  workflow_dispatch:

jobs:
  libc-test:
    uses: ./.github/workflows/libc-test.yml
    secrets: inherit

  ltp:
    uses: ./.github/workflows/ltp.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: [libc-test, ltp]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libc-test-*.log
          path: web/data/libc-test
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ltp-*.json
          path: web/data/ltp
          merge-multiple: true

      - name: Create empty markdown files
        run: |
          find web/data/libc-test -type f -name '*.log' \
            -exec sh -c 'base="$(basename "$1" .log)"; printf "+++\ntitle = \"libc-test (%s)\"\n+++\n" "$base" > web/content/libc-test/"$base".md' shell {} \;
          find web/data/ltp -type f -name '*.json' \
            -exec sh -c 'base="$(basename "$1" .json)"; printf "+++\ntitle = \"LTP (%s)\"\n+++\n" "$base" > web/content/ltp/"$base".md' shell {} \;

      - uses: getzola/github-pages@435a833fd3f1edcb28d70576c89e30a6365cd8f7 # v1
        with:
          working_directory: web
          zola_version: v0.23.6

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
